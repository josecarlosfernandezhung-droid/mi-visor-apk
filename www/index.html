<body>
<div class="container">
    <div class="header">
        <h1>📦 Stock en Vivo</h1>
        <p>Vista en tiempo real, sin necesidad de instalar nada</p>
    </div>
    <div class="body">
        <div id="setup" class="setup" style="display:none;">
            <label for="urlInput">Pega la URL del archivo JSON de tu inventario en GitHub (raw.githubusercontent.com)</label>
            <input type="text" id="urlInput" placeholder="https://raw.githubusercontent.com/usuario/repo/main/stock.json">
            <button class="btn" onclick="conectar()">🔌 Conectar</button>
            <div id="mensajeSetup" style="margin-top:10px;"></div>
        </div>

        <div id="vista" style="display:none;">
            <div class="barra-superior">
                <p id="estado" class="estado">🟡 Cargando...</p>
                <button class="btn-refrescar" onclick="refrescarAhora()">🔄 Actualizar</button>
            </div>
            <input type="text" id="buscador" class="buscador" placeholder="🔍 Buscar producto o SKU..." oninput="renderizarTabla()">
            <div id="selectorAlmacen" class="selector-almacen" style="display:none;"></div>
            <div id="filaOrdenUrgencia" class="fila-orden-urgencia" style="display:none;">
                <label for="btnOrdenUrgenciaVisor">⚠️ Ordenar por urgencia (lo que menos hay primero)</label>
                <button type="button" class="toggle-switch" id="btnOrdenUrgenciaVisor" onclick="alternarOrdenUrgenciaVisor()" role="switch" aria-checked="false">
                    <span class="toggle-switch-thumb"></span>
                </button>
            </div>
            <div id="contenedorTabla"></div>
            <p id="actualizado" class="actualizado"></p>
            <div class="cambiar"><a onclick="cambiarConexion()">Conectar a otro inventario</a></div>
        </div>
    </div>
</div>

<script>
    // URL por defecto: el JSON de stock que la app de inventario sube a GitHub.
    // Se puede cambiar desde "Conectar a otro inventario" si algún día cambia de repo.
    const URL_POR_DEFECTO = 'https://raw.githubusercontent.com/josecarlosfernandezhung-droid/inventario-datos-sync./main/stock.json';

    const CACHE_KEY = 'visorStockCache';
    const URL_KEY = 'visorStockGithubUrl';
    const INTERVALO_REFRESCO_MS = 30000; // 30s — de sobra, GitHub cachea el raw ~1-5min igual

    let urlActual = null;
    let ultimosDatos = null;
    let intervaloId = null;
    let almacenSeleccionado = localStorage.getItem('visorAlmacenSeleccionado') || 'productos';

    // Arma la lista de "vistas" (almacenes) disponibles a partir de lo que venga en el
    // JSON: Punto de Venta y Almacén Principal (como antes), más Piso de Venta y
    // cualquier almacén adicional que José haya creado en la app — todos con la misma
    // forma { id, icono, nombre, items, campoCantidad }, para que el resto del código
    // no tenga que distinguirlos.
    function construirVistasDisponibles() {
        const vistas = [];
        if(!ultimosDatos) return vistas;

        // Nombres a medida que José haya puesto desde el Gestor (opcional); si no hay
        // apodo para un id, se usa el nombre de siempre.
        const etiquetas = ultimosDatos.etiquetas || {};
        const nombrePara = (id, porDefecto) => (etiquetas[id] && etiquetas[id].trim()) ? etiquetas[id].trim() : porDefecto;

        if(Array.isArray(ultimosDatos.productos) && ultimosDatos.productos.length > 0) {
            vistas.push({ id: 'productos', icono: '🏬', nombre: nombrePara('productos', 'Punto de Venta'), items: ultimosDatos.productos, campoCantidad: 'stock' });
        }
        if(Array.isArray(ultimosDatos.almacenPrincipal) && ultimosDatos.almacenPrincipal.length > 0) {
            vistas.push({ id: 'almacenPrincipal', icono: '🏭', nombre: nombrePara('almacenPrincipal', 'Almacén Principal'), items: ultimosDatos.almacenPrincipal, campoCantidad: 'cantidad' });
        }
        if(Array.isArray(ultimosDatos.pisoVenta) && ultimosDatos.pisoVenta.length > 0) {
            vistas.push({ id: 'pisoVenta', icono: '🧍', nombre: nombrePara('pisoVenta', 'Piso de Venta'), items: ultimosDatos.pisoVenta, campoCantidad: 'cantidad' });
        }
        if(Array.isArray(ultimosDatos.almacenesExtra)) {
            ultimosDatos.almacenesExtra.forEach(a => {
                if(Array.isArray(a.productos) && a.productos.length > 0) {
                    vistas.push({ id: 'extra_' + a.id, icono: a.icono || '📦', nombre: nombrePara('extra_' + a.id, a.nombre), items: a.productos, campoCantidad: 'cantidad' });
                }
            });
        }

        // Si hay más de un lugar con datos, se agrega al principio una pestaña "Todo" que
        // suma la cantidad de cada producto en todos los lugares (empareja por SKU, y si
        // no hay SKU, por nombre), para ver de un vistazo cuánto hay en total sin tener
        // que ir sumando pestaña por pestaña.
        if(vistas.length > 1) {
            const mapa = new Map();
            vistas.forEach(v => {
                v.items.forEach(p => {
                    const cantidad = parseFloat(p[v.campoCantidad]) || 0;
                    const key = (p.sku && p.sku.trim()) ? 'sku:' + p.sku.trim().toUpperCase() : 'nom:' + p.nombre.trim().toLowerCase();
                    if(mapa.has(key)) {
                        mapa.get(key).cantidad += cantidad;
                    } else {
                        mapa.set(key, { nombre: p.nombre, sku: p.sku || '', cantidad });
                    }
                });
            });
            vistas.unshift({ id: 'todo', icono: '📊', nombre: 'Todo', items: Array.from(mapa.values()), campoCantidad: 'cantidad' });
        }

        return vistas;
    }

    function renderizarSelectorAlmacen(vistas) {
        const selector = document.getElementById('selectorAlmacen');
        if(vistas.length <= 1) {
            selector.style.display = 'none';
            selector.innerHTML = '';
            return;
        }
        // Si el almacén guardado ya no existe en los datos actuales (por ejemplo, se
        // eliminó desde la app), se cae de vuelta al primero disponible.
        if(!vistas.some(v => v.id === almacenSeleccionado)) {
            almacenSeleccionado = vistas[0].id;
        }
        selector.style.display = 'flex';
        selector.innerHTML = vistas.map(v => `
            <button type="button" class="btn-almacen ${v.id === almacenSeleccionado ? 'activo' : ''}" onclick="elegirAlmacen('${v.id}')">${v.icono} ${v.nombre}</button>
        `).join('');
    }

    function elegirAlmacen(cual) {
        almacenSeleccionado = cual;
        localStorage.setItem('visorAlmacenSeleccionado', cual);
        renderizarTabla();
    }

    function alternarOrdenUrgenciaVisor() {
        const activo = localStorage.getItem('visorOrdenUrgencia') === '1';
        localStorage.setItem('visorOrdenUrgencia', activo ? '0' : '1');
        renderizarTabla();
    }

    function guardarCache(datos) {
        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(datos));
        } catch(e) { /* si no cabe en localStorage, seguimos igual sin romper nada */ }
    }

    function leerCache() {
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch(e) { return null; }
    }

    window.addEventListener('DOMContentLoaded', function() {
        // Prioridad: URL en el hash (#url-encoded) > URL guardada > la de por defecto
        const hash = window.location.hash.replace('#', '');
        const guardada = localStorage.getItem(URL_KEY);

        if(hash) {
            try {
                const decodificada = decodeURIComponent(hash);
                iniciarConexion(decodificada);
            } catch(e) {
                iniciarConexion(guardada || URL_POR_DEFECTO);
            }
        } else if(guardada) {
            iniciarConexion(guardada);
        } else {
            iniciarConexion(URL_POR_DEFECTO);
        }
    });

    function conectar() {
        const url = document.getElementById('urlInput').value.trim();
        if(!url) {
            document.getElementById('mensajeSetup').innerHTML = '<span style="color:#c0392b;">Pega primero la URL del archivo JSON.</span>';
            return;
        }
        if(!url.startsWith('http')) {
            document.getElementById('mensajeSetup').innerHTML = '<span style="color:#c0392b;">Eso no parece una URL válida.</span>';
            return;
        }
        localStorage.setItem(URL_KEY, url);
        iniciarConexion(url);
    }

    function mostrarSinConexion(motivo) {
        const cache = leerCache();
        if(cache) {
            ultimosDatos = cache;
            renderizarTabla();
            document.getElementById('estado').textContent = '🟠 Sin conexión — mostrando últimos datos guardados';
        } else {
            document.getElementById('estado').textContent = '🔴 ' + motivo;
        }
        document.getElementById('estado').style.color = '#c0392b';
    }

    function iniciarConexion(url) {
        urlActual = url;
        document.getElementById('setup').style.display = 'none';
        document.getElementById('vista').style.display = 'block';

        // Mientras carga (o si no hay internet), mostramos de una vez lo último guardado
        const cache = leerCache();
        if(cache) {
            ultimosDatos = cache;
            renderizarTabla();
        }

        cargarDatos(true);

        instalarListenersConexion();

        if(intervaloId) clearInterval(intervaloId);
        intervaloId = setInterval(() => cargarDatos(false), INTERVALO_REFRESCO_MS);
    }

    function refrescarAhora() {
        document.getElementById('estado').textContent = '🟡 Actualizando...';
        document.getElementById('estado').style.color = '#b8860b';
        cargarDatos(true);
    }

    async function cargarDatos(mostrarCargando) {
        if(!urlActual) return;

        if(!navigator.onLine) {
            mostrarSinConexion('Sin internet en este momento.');
            return;
        }

        if(mostrarCargando) {
            document.getElementById('estado').textContent = '🟡 Conectando... (puede tardar según tu conexión)';
            document.getElementById('estado').style.color = '#b8860b';
        }

        try {
            // Se agrega un parámetro con la hora para evitar que el navegador/CDN
            // sirva una copia vieja en caché cuando el usuario pide actualizar.
            const separador = urlActual.includes('?') ? '&' : '?';
            const respuesta = await fetch(urlActual + separador + 't=' + Date.now(), { cache: 'no-store' });

            if(!respuesta.ok) {
                mostrarSinConexion('No se pudo leer el archivo (error ' + respuesta.status + ').');
                return;
            }

            const datos = await respuesta.json();
            ultimosDatos = datos;
            guardarCache(datos);
            document.getElementById('estado').textContent = '🟢 Conectado — datos actualizados';
            document.getElementById('estado').style.color = '#2e7d32';
            renderizarTabla();
        } catch(e) {
            mostrarSinConexion('No se pudo conectar: ' + e.message);
        }
    }

    let listenersInstalados = false;
    function instalarListenersConexion() {
        // Solo se instalan una vez, para no duplicar el evento en cada reconexión
        if(listenersInstalados) return;
        listenersInstalados = true;
        window.addEventListener('offline', function() {
            mostrarSinConexion('Se perdió la conexión a internet.');
        });
        window.addEventListener('online', function() {
            document.getElementById('estado').textContent = '🟡 Conexión recuperada, actualizando...';
            document.getElementById('estado').style.color = '#b8860b';
            cargarDatos(true);
        });
    }

    function renderizarTabla() {
        const cont = document.getElementById('contenedorTabla');
        const filaOrden = document.getElementById('filaOrdenUrgencia');
        const btnOrden = document.getElementById('btnOrdenUrgenciaVisor');

        if(!ultimosDatos) {
            document.getElementById('selectorAlmacen').style.display = 'none';
            if(filaOrden) filaOrden.style.display = 'none';
            cont.innerHTML = '<p class="sin-datos">Todavía no hay datos sincronizados desde la app de inventario.</p>';
            return;
        }

        const vistas = construirVistasDisponibles();
        renderizarSelectorAlmacen(vistas);

        const vistaActual = vistas.find(v => v.id === almacenSeleccionado) || vistas[0];

        if(filaOrden) filaOrden.style.display = vistaActual ? 'flex' : 'none';
        const ordenUrgencia = localStorage.getItem('visorOrdenUrgencia') === '1';
        if(btnOrden) {
            btnOrden.classList.toggle('on', ordenUrgencia);
            btnOrden.setAttribute('aria-checked', String(ordenUrgencia));
        }

        const filtro = (document.getElementById('buscador').value || '').trim().toLowerCase();

        let filas = [];
        if(vistaActual) {
            const campo = vistaActual.campoCantidad;
            filas = vistaActual.items
                .filter(p => (p[campo] || 0) > 0)
                .filter(p => !filtro || p.nombre.toLowerCase().includes(filtro) || (p.sku || '').toLowerCase().includes(filtro));

            if(ordenUrgencia) {
                // Lo que menos hay primero (más urgente de reponer).
                filas.sort((a, b) => (a[campo] || 0) - (b[campo] || 0) || a.nombre.localeCompare(b.nombre));
            } else {
                filas.sort((a, b) => a.nombre.localeCompare(b.nombre));
            }
        }

        let html;
        if(!vistaActual) {
            html = '<p class="sin-datos">Todavía no hay datos sincronizados desde la app de inventario.</p>';
        } else if(filas.length === 0) {
            html = filtro
                ? '<p class="sin-datos">Ningún producto disponible coincide con la búsqueda.</p>'
                : '<p class="sin-datos">No hay productos con existencia en este momento.</p>';
        } else {
            html = '<table><thead><tr><th>Producto</th><th>SKU</th><th>Stock</th></tr></thead><tbody>';
            filas.forEach(p => {
                const cantidad = p[vistaActual.campoCantidad];
                const unidad = vistaActual.campoCantidad === 'stock' ? (p.unidad || '') : '';
                const claseStock = cantidad <= 10 ? 'stock-bajo' : 'stock-ok';
                html += `<tr><td>${p.nombre}</td><td>${p.sku || '-'}</td><td class="${claseStock}">${cantidad} ${unidad}</td></tr>`;
            });
            html += '</tbody></table>';
        }
        cont.innerHTML = html;

        if(ultimosDatos.actualizado) {
            const fecha = new Date(ultimosDatos.actualizado);
            document.getElementById('actualizado').textContent = 'Última actualización: ' + fecha.toLocaleString('es-ES');
        }
    }

    function cambiarConexion() {
        if(intervaloId) clearInterval(intervaloId);
        localStorage.removeItem(URL_KEY);
        localStorage.removeItem(CACHE_KEY);
        document.getElementById('vista').style.display = 'none';
        document.getElementById('urlInput').value = '';
        document.getElementById('setup').style.display = 'block';
    }
</script>
</body>
